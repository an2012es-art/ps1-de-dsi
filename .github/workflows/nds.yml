name: Build NDS
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          dkp-pacman -S --noconfirm nds-examples
          cp -r /opt/devkitpro/examples/nds/hello_world proj
          rm -f proj/source/*
          cp ps1cpu_nds.cpp proj/source/main.cpp
          make -C proj
          ls proj
      - uses: actions/upload-artifact@v4
        with:
          name: ps1cpu-nds
          path: proj/*.nds
